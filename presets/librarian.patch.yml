# 「书阁运维」专职 Agent preset
#
# 这个文件被 `C:\dsh-plugin-master\cordis.patch.yml` 通过 `- insert:` 引入吗？
# **不是。** DSH 的 profile patch 只能合并同一个文件里的条目，不能跨文件 include。
# 所以本文件是**权威定义处**，实际生效靠 master 插件把它内联进 `agentPresets.register()`
# （见 `lib/index.js` 的 `librarianPlugins()`）。
#
# 保留本文件的目的：让「这个 Agent 由哪些插件组成」有一个可读、可 diff 的单一出处，
# 而不是散落在 JS 里的对象字面量中。
#
# ⚠ 改这里的配置**不会自动生效** —— 必须同步改 `lib/index.js` 的 `librarianPlugins()`。
#   两者不一致时，以 JS 为准（那才是运行时真正读的东西）。
#   这是当前架构的已知缺陷，记为待办。
#
# ── 为什么它是「专职」而不是「又一个 general preset」 ─────────────────────────
#
# 判据只有一条：**工具面被真实收窄，且人格带专属纪律。**
# 如果它和 standard 一样满配工具，那就只是换了个提示词，不构成"专职"。
#
# 收窄了什么：
#   · 不给 `tool-web` —— 运维书阁不需要上网，给了反而分心
#   · 不给 `tool-subagent` —— 运维是单线程串行活，不需要再派子 agent
#   · 不给 `tool-workflow` / `tool-ralph` —— 同上
#   · 保留 `pwsh` —— **必须给**。书阁的 25 个测试脚本、自检、建库都需要真跑
#   · 保留 `tool-skill` —— 它要读 `l1-library-keeper` 那套库管纪律
#
# 给了什么独有的：
#   · persona —— 「书阁库管」人格 + 五条写盘纪律
#   · allowedAgentPresets 不含本 preset 自身 —— 防止它递归派自己

- insert:
    - id: preset-librarian
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: librarian
        name: 书阁运维
        description: 书阁（dsh-manuscript）的库管：入库、提炼、体检、策展。唯一有写权的 Agent。
        order: 10
        plugins:
          # ── 身份 ──────────────────────────────────────────────
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # prefix 由 lib/index.js 的 LIBRARIAN_PREFIX 提供，这里不重复写
              # （单一事实源：长文本放 JS，避免两处不同步）
              suffix: |
                Your working directory is {{cwd}}.
                书阁数据目录：$env:USERPROFILE\.dsh\dsh-manuscript

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          # ── 工具面（刻意收窄）────────────────────────────────
          # shell 必须给：书阁有 25 个 test-*.mjs 与 selfcheck，运维要能真跑
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: false
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          # ★ send_message —— 子代理的唯一回报通道，**必须给**。
          #   它和 tool-subagent 同在 dsh-tool-subagent-control 包里。
          #   第一版把整个 delegation 组砍掉时连它一起砍了，
          #   结果 librarian 干完活无法汇报（2026-11-05 实测确认）。
          #   「不派活」和「能回话」是两件事，必须分开判断。
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'

          # ⚠ 刻意不给：
          #   tool-web                   —— 运维不需要上网
          #   tool-subagent              —— 单线程串行活，不派子 agent
          #   tool-subagent-list-agents  —— 库管不需要看成员列表
          #   tool-workflow / tool-ralph —— 同上
          # 少一个工具就少一份 token 成本，也少一种跑偏的可能。
